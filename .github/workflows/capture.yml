name: capture

# Renders a tools/capture/*.gd script on CI so nobody runs windowed Godot on the director's
# PC (a windowed run can steal focus from his fullscreen game). Dispatched by hand or by
# tools/capture/ci_capture.sh; never on push or pull request. ubuntu-latest has no GPU, so
# Godot runs under xvfb on Mesa software rendering (llvmpipe for OpenGL, lavapipe for
# Vulkan). `auto` tries Forward+ on lavapipe first and falls back to gl_compatibility; the
# run log and out/RENDERER.txt say which one rendered. Expect it to be slow (software), and
# expect looks that differ from the local GPU render: see tools/capture/README.md.
#
# GitHub only dispatches workflows that exist on the default branch, so this file lives on
# main; the capture scripts themselves come from the dispatched --ref branch.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Capture script under tools/capture/ (e.g. capture_rig.gd, capture_looks.gd)"
        required: true
        default: capture_rig.gd
      args:
        description: "Arguments after the -- (e.g. --species=reptilian --stage=adult). --out=<dir> is added for you"
        required: false
        default: ""
      renderer:
        description: "auto = Forward+ on lavapipe, else gl_compatibility"
        type: choice
        default: auto
        options: [auto, forward_plus, mobile, gl_compatibility]
      movie:
        description: "Record a clip with --write-movie (and convert it to MP4)"
        type: boolean
        default: false
      fps:
        description: "Fixed fps for the clip"
        default: "30"
      resolution:
        description: "WIDTHxHEIGHT"
        default: "1280x720"
      ref:
        description: "Git ref to capture (default: the ref the workflow was dispatched on)"
        required: false
        default: ""

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The display fonts are LFS (3 files, ~26 KB): without them every label logs a
          # FreeType error with a backtrace and the render crawls past the time limit.
          lfs: true

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip" \
          || curl -fsSL --retry 3 -o godot.zip \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip && rm godot.zip
          mv "${name}" godot && chmod +x godot

      - name: Install xvfb, Mesa software drivers (llvmpipe, lavapipe) and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri libglx-mesa0 \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64 ffmpeg vulkan-tools

      - name: Import the project
        run: |
          timeout 900 "$HOME/godot/godot" --headless --path . --import > import.log 2>&1 || { cat import.log; exit 1; }
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" import.log; then cat import.log; exit 1; fi

      - name: Capture
        env:
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
          RENDERER: ${{ inputs.renderer || 'auto' }}
          MOVIE: ${{ inputs.movie }}
          FPS: ${{ inputs.fps || '30' }}
          RES: ${{ inputs.resolution || '1280x720' }}
        run: |
          case "$SCRIPT" in *[!A-Za-z0-9_.]*|"") echo "::error::bad script name"; exit 1;; esac
          test -f "tools/capture/$SCRIPT" || { echo "::error::tools/capture/$SCRIPT does not exist"; exit 1; }
          out="$PWD/out"; mkdir -p "$out"
          user_args="$ARGS"
          case "$user_args" in *--out=*) ;; *) user_args="$user_args --out=$out";; esac
          export LIBGL_ALWAYS_SOFTWARE=1
          vulkaninfo --summary 2>&1 | grep -E "deviceName|driverName" | head -3 || true

          run_one() { # $1 = rendering method, $2 = rendering driver
            local movie_args=()
            if [ "$MOVIE" = true ]; then movie_args=(--write-movie "$out/clip.avi" --fixed-fps "$FPS"); fi
            echo "=== $1 on $2 ===" | tee -a "$out/RENDERER.txt"
            # $user_args is split on purpose: it is a list of --flag=value words.
            # shellcheck disable=SC2086
            timeout 3000 xvfb-run -a -s "-screen 0 ${RES}x24" \
              "$HOME/godot/godot" --path . --rendering-method "$1" --rendering-driver "$2" \
              --resolution "$RES" --windowed "${movie_args[@]}" \
              --script "tools/capture/$SCRIPT" -- $user_args > "$out/godot-$1.log" 2>&1
          }

          code=0
          case "$RENDERER" in
            auto)
              run_one forward_plus vulkan || code=$?
              if [ "$code" != 0 ]; then
                echo "::warning::forward_plus on lavapipe failed (exit $code); falling back to gl_compatibility"
                tail -n 30 "$out/godot-forward_plus.log"
                code=0; run_one gl_compatibility opengl3 || code=$?
              fi;;
            forward_plus|mobile) run_one "$RENDERER" vulkan || code=$?;;
            gl_compatibility) run_one gl_compatibility opengl3 || code=$?;;
          esac
          tail -n 60 "$out"/godot-*.log
          exit "$code"

      - name: Convert the clip to MP4 and collect user:// output
        if: always()
        run: |
          mkdir -p out
          if [ -f out/clip.avi ]; then
            ffmpeg -y -loglevel error -i out/clip.avi -c:v libx264 -pix_fmt yuv420p -crf 18 out/clip.mp4 && rm out/clip.avi
          fi
          # Scripts that default to user:// (capture_looks.gd without --out) land here.
          if [ -d "$HOME/.local/share/godot/app_userdata" ]; then
            mkdir -p out/userdata && cp -r "$HOME/.local/share/godot/app_userdata/." out/userdata/
            rm -rf out/userdata/*/shader_cache
          fi
          ls -laR out | head -80

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-${{ github.run_id }}-${{ strategy.job-index }}
          path: out
          retention-days: 14
          if-no-files-found: warn
