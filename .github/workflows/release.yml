name: release

# The Itch demo zip (roadmap M4, D-457). Runs by hand or on a v* tag push; never on a PR.
# Same setup as build.yml (Godot ${GODOT_VERSION}, native DLL, Windows release templates), then
# tools/build_release.py: tools/export_windows.sh --release (no DEV ONLY files, pack check),
# staged into dist/ and zipped. Uploads "KaijuEvolution-itch-<sha>" (14 days). It never pushes
# to itch.io: butler push is a manual, director-approved step (tools/build_release.py --push).
#   gh workflow run release.yml --ref main [-f ref=<branch, tag or sha>]
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to export (default: the dispatched ref)"
        required: false
        default: ""

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  itch-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: true # native/godot-cpp
      # The fonts, sounds, kaiju skins and baked models go into the pack (tools/pck_check.py proves they are real).
      - uses: ./.github/actions/lfs-files

      # tools/pck_check.py reads the zstd-compressed resources with compression.zstd (3.14+).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The native core (native/): the export copies the Windows release library next to the exe,
      # and the exe logs an error at launch without it, so build it before the export.
      - name: Build the native extension (Windows x86_64, release)
        run: |
          python -m pip install scons
          cd native && python -m SCons platform=windows target=template_release arch=x86_64 -j4

      - name: Cache Godot and its Windows export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-win64-release-templates

      # The templates archive holds every platform; keep only the Windows release pair.
      - name: Download Godot ${{ env.GODOT_VERSION }} and the Windows templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot/templates && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          unzip -q godot.zip && rm godot.zip
          curl -fsSL --retry 3 -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe templates/version.txt \
            -d templates
          rm templates.tpz
          ls -la ~/godot ~/godot/templates

      - name: Put the templates where Godot looks for them
        run: |
          dest="$(cygpath -u "$APPDATA")/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && cp ~/godot/templates/* "$dest/"

      # tools/export_windows.sh: import (script errors fail it), export the "Windows Desktop"
      # preset, then tools/pck_check.py proves the pack holds the real fonts (not LFS pointers)
      # and every kaiju model, and ships no tools/ scripts.
      - name: Export (release), stage and zip
        run: |
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_win64_console.exe" timeout 1200 python tools/build_release.py 2>&1 | tee export.log
          test "${PIPESTATUS[0]}" = 0 || { echo "::error::release export failed"; exit 1; }
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Launch the build headless; it must reach the main scene
        run: |
          main=$(tr -d '\r' < project.godot | sed -n 's/^run\/main_scene="\(.*\)"$/\1/p')
          exe=$(ls dist/*/KaijuEvolution.exe | head -n 1)
          code=0
          timeout 300 "$exe" --headless --verbose --quit-after 120 > launch.log 2>&1 || code=$?
          if [ "$code" != 0 ]; then cat launch.log; echo "::error::the build exited with $code"; exit 1; fi
          grep -q "Completed load for: '$main'" launch.log || { cat launch.log; echo "::error::never loaded $main"; exit 1; }
          if grep -qE "SCRIPT ERROR|^ERROR" launch.log; then cat launch.log; echo "::error::the build logged an error"; exit 1; fi

      - name: Upload the Itch zip
        uses: actions/upload-artifact@v4
        with:
          name: KaijuEvolution-itch-${{ env.sha }}
          path: dist/*.zip
          retention-days: 14

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            export.log
            launch.log
