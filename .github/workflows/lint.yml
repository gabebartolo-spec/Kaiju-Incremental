name: lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-caps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce line caps
        shell: bash
        run: |
          # Caps are read from each doc's own "Cap: N lines" header (first 6 lines),
          # so the number lives in the doc, not here. Handoffs are capped by the template.
          fail=0
          check() { # file cap
            n=$(wc -l < "$1")
            if [ "$n" -gt "$2" ]; then
              echo "::error file=$1::$n lines, cap is $2 (DECISIONS.md: python tools/roll_decisions.py)"
              fail=1
            fi
          }
          for f in docs/*.md; do
            cap=$(head -n 6 "$f" | sed -n 's/^Cap: \([0-9][0-9]*\) lines.*/\1/p' | head -n 1)
            [ -n "$cap" ] && check "$f" "$cap"
          done
          check CLAUDE.md 120
          exit $fail

  project-lints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema (the data_schemas smoke test needs it; tests.yml pins the same)
        run: pip install --quiet "jsonschema>=4.18,<5" "fonttools>=4.40,<5" "numpy>=1.26,<3"
      - name: Run project lints
        shell: bash
        run: |
          # Skipped until the project adds tools/lint/run_all.sh.
          if [ -f tools/lint/run_all.sh ]; then
            bash tools/lint/run_all.sh
          else
            echo "tools/lint/run_all.sh not present yet; skipping"
          fi
      - name: Every workflow job has a timeout
        run: |
          python tools/lint/workflow_timeouts.py --self-test
          python tools/lint/workflow_timeouts.py

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        shell: bash
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the PR's commits
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact -v --config .gitleaks.toml --log-opts="$BASE..$HEAD" .'

  # CLAUDE.md hard rule 5: every file under assets/ is covered by a CLEARED row of
  # docs/LICENSING_REGISTER.md (debt row 6, D-295). Red when a file has no row.
  licence-register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The register covers every asset file
        run: |
          python3 tools/lint/licence_register.py --self-test
          python3 tools/lint/licence_register.py
