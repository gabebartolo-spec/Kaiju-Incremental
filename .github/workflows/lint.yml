name: lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-caps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce line caps
        shell: bash
        run: |
          # Caps are read from each doc's own "Cap: N lines" header (first 6 lines),
          # so the number lives in the doc, not here. Handoffs are capped by the template.
          fail=0
          check() { # file cap
            n=$(wc -l < "$1")
            if [ "$n" -gt "$2" ]; then
              echo "::error file=$1::$n lines, cap is $2"
              fail=1
            fi
          }
          for f in docs/*.md; do
            cap=$(head -n 6 "$f" | sed -n 's/^Cap: \([0-9][0-9]*\) lines.*/\1/p' | head -n 1)
            [ -n "$cap" ] && check "$f" "$cap"
          done
          check CLAUDE.md 120
          for f in agent-handoffs/*.md; do
            [ -e "$f" ] && check "$f" 120
          done
          exit $fail

  project-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run project lints
        shell: bash
        run: |
          # Skipped until the project adds tools/lint/run_all.sh.
          if [ -f tools/lint/run_all.sh ]; then
            bash tools/lint/run_all.sh
          else
            echo "tools/lint/run_all.sh not present yet; skipping"
          fi

  gdlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      - name: List GDScript files
        shell: bash
        run: |
          # Every .gd file outside .godot/, .claude/ and tests/fixtures/lint/ (planted lookalikes for
          # the project lints, not production code). Limits live in .gdlintrc (docs/05).
          find . -name '*.gd' -not -path './.godot/*' -not -path './.claude/*' -not -path './tests/fixtures/lint/*' | sort > gd_files.txt
          echo "$(wc -l < gd_files.txt) GDScript files"
      - name: File names are snake_case (docs/05)
        shell: bash
        run: |
          # gdlint has no file-name rule; docs/05 wants snake_case.gd.
          bad=$(grep -v -E '/[a-z0-9]+(_[a-z0-9]+)*\.gd$' gd_files.txt || true)
          if [ -n "$bad" ]; then
            echo "$bad" | sed 's/^/::error::not snake_case: /'
            exit 1
          fi
      - name: gdlint
        shell: bash
        run: xargs -a gd_files.txt gdlint
      - name: gdformat --check
        shell: bash
        run: xargs -a gd_files.txt gdformat --check

  # Secret scan: the default gitleaks rules plus the project's own in .gitleaks.toml
  # (the fake-secret pattern the gate plants, and a generic sk- key rule).
  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits through the API; contents: read alone is a 403.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
