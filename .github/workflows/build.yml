name: build

# Exports the Windows build and proves it launches. Runs on every push to main (the
# artefact the director plays) and on demand; never on a pull request. The export and
# the headless launch do not compile sim/ or count autoloads, so on a PR this job went
# green in 34 s while `test` was red (kickoff gate finding): a build is only
# meaningful once `test` has passed, which on main it has. A PR that changes
# project.godot, export_presets.cfg or this file is proven by the push to main that
# merges it, or by running the workflow by hand on the branch. The exported game runs
# headless for 120 frames and must load the main scene from project.godot without
# logging an error. The export itself is tools/export_windows.sh (with its pack check), the
# same script agents run locally. On main the .exe is uploaded as "KaijuEvolution-windows"
# (30 days); a dispatched run uploads "KaijuEvolution-<sha>" (7 days), the demo build. Sprite
# sheets under assets/sprites are plain git (.gitattributes). The display fonts are LFS
# (assets/fonts, ~26 KB), so the checkout pulls LFS; LFS bandwidth is metered, so keep big
# binaries out of it or cache them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # By hand, for any branch (the demo build comes from here): exports `ref` (default: the
  # branch the run is dispatched on) and uploads KaijuEvolution-<sha> for 7 days.
  #   gh workflow run build.yml --ref claude/look-options [-f ref=<branch or sha>]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to export (default: the dispatched branch)"
        required: false
        default: ""

concurrency:
  group: build-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: true # native/godot-cpp
      # The fonts, sounds, kaiju skins and baked models go into the pack (tools/pck_check.py proves they are real).
      - uses: ./.github/actions/lfs-files

      # tools/pck_check.py reads the zstd-compressed resources with compression.zstd (3.14+).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The native core (native/): the export copies the Windows release library next to the exe,
      # and the exe logs an error at launch without it, so build it before the export.
      - name: Build the native extension (Windows x86_64, release)
        run: |
          python -m pip install scons
          cd native && python -m SCons platform=windows target=template_release arch=x86_64 -j4

      # The small artifact tools/native_dll.sh reads (prepush compares a PC's DLL with it): the
      # release DLL and native.txt, the git tree id of native/ it was built from. The link is
      # reproducible (native/SConstruct, /Brepro), so one tree gives one md5.
      - name: Keep the native DLL
        run: |
          mkdir -p native-out
          cp native/bin/libkaiju_carve.windows.template_release.x86_64.dll native-out/
          { echo "tree=$(git rev-parse HEAD:native)"; echo "md5=$(md5sum native-out/*.dll | cut -d' ' -f1)"; } > native-out/native.txt
          cat native-out/native.txt
      - name: Upload the native DLL
        uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: native-out/*
          retention-days: 30

      - name: Cache Godot and its Windows export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-win64-release-templates

      # The templates archive holds every platform; keep only the Windows release pair.
      - name: Download Godot ${{ env.GODOT_VERSION }} and the Windows templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot/templates && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          unzip -q godot.zip && rm godot.zip
          curl -fsSL --retry 3 -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe templates/version.txt \
            -d templates
          rm templates.tpz
          ls -la ~/godot ~/godot/templates

      - name: Put the templates where Godot looks for them
        run: |
          dest="$(cygpath -u "$APPDATA")/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && cp ~/godot/templates/* "$dest/"

      # tools/export_windows.sh: import (script errors fail it), export the "Windows Desktop"
      # preset, then tools/pck_check.py proves the pack holds the real fonts (not LFS pointers)
      # and every kaiju model, and ships no tools/ scripts.
      - name: Import, export and check the pack
        run: |
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_win64_console.exe"             timeout 1200 tools/export_windows.sh 2>&1 | tee export.log
          test "${PIPESTATUS[0]}" = 0 || { echo "::error::export or pack check failed"; exit 1; }
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Launch the build headless; it must reach the main scene
        run: |
          main=$(tr -d '\r' < project.godot | sed -n 's/^run\/main_scene="\(.*\)"$/\1/p')
          code=0
          timeout 300 out/windows/KaijuEvolution.exe --headless --verbose --quit-after 120 > launch.log 2>&1 || code=$?
          if [ "$code" != 0 ]; then
            cat launch.log; echo "::error::the exported build exited with $code"; exit 1
          fi
          if ! grep -q "Completed load for: '$main'" launch.log; then
            cat launch.log; echo "::error::the exported build never loaded the main scene $main"; exit 1
          fi
          if grep -qE "SCRIPT ERROR|^ERROR" launch.log; then
            cat launch.log; echo "::error::the exported build logged an error"; exit 1
          fi
          echo "The exported build launched headless and loaded $main."

      - name: Upload the build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: KaijuEvolution-windows
          path: |
            out/windows/KaijuEvolution.exe
            out/windows/*.dll
          retention-days: 30

      - name: Upload the build for the dispatched ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: KaijuEvolution-${{ env.sha }}
          path: |
            out/windows/KaijuEvolution.exe
            out/windows/*.dll
          retention-days: 7

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            export.log
            launch.log
