name: tests

# Code, data and config pull requests and pushes to main run the Godot checks: a compile-only
# preflight, the test suites in timing-balanced shards, and the harness self-test.
#
#   - Documentation-only PRs and drafts skip the Godot jobs (`test` still reports green).
#   - A push to main whose tree is the tree a green PR run already tested skips its re-test
#     (tools/ci_reuse_pr_run.sh).
#   - The shards come from measured times (tools/ci_timings.txt, tools/plan_ci_shards.sh):
#     no suite or shard list is kept by hand. A PR run targets 10-12 minutes; it is about 4.
#   - Slow, noisy suites ("pr_skip" in tools/ci_timings.txt; none yet) run on pushes to main
#     only, reported and never blocking.
#   - Every test function must have run and made a check (tests/lib/functions_ran.gd); there is
#     no floor file.
#
# "test" is the required check on main: the last job, it passes when the plan, the preflight,
# every shard and the extras job passed (or were skipped on purpose).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# A pull request's newer push cancels its older run; every push to main gets its own verdict.
concurrency:
  group: tests-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  # Decides whether the Godot checks run and how the suites split across shards.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
      reason: ${{ steps.changes.outputs.reason }}
      shards: ${{ steps.shards.outputs.matrix }}
      slow: ${{ steps.shards.outputs.slow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the PR merge commit and its parents; main's previous commit

      # Anything outside docs/ and *.md files counts as code.
      - name: Check for code changes
        id: changes
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
        run: |
          code=true
          reason=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$IS_DRAFT" = "true" ]; then
              code=false
              reason="draft pull request: the Godot checks run when it is marked ready for review"
            elif ! git diff --name-only HEAD^1 HEAD | grep -qvE '^docs/|\.md$'; then
              code=false
              reason="documentation only"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            reused=$(bash tools/ci_reuse_pr_run.sh || true)
            if [ -n "$reused" ]; then
              code=false
              reason="the tree on main is the tree pull request ${reused#reuse } already tested green"
            fi
          fi
          if [ "$code" = false ]; then echo "Skipping the Godot checks ($reason)."; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Plan the shards from the measured times
        id: shards
        run: |
          bash tools/plan_ci_shards.sh
          echo "matrix=$(bash tools/plan_ci_shards.sh --matrix)" >> "$GITHUB_OUTPUT"
          echo "slow=$(bash tools/plan_ci_shards.sh --slow)" >> "$GITHUB_OUTPUT"

  # Compile-only: imports the project and fails on any script error in about a minute,
  # before the shards spend their time.
  preflight:
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Import the project and compile every script
        run: |
          code=0
          timeout 600 "$HOME/godot/godot" --headless --path . --editor --import > "$RUNNER_TEMP/import.log" 2>&1 || code=$?
          if [ "$code" != 0 ] || grep -qE "SCRIPT ERROR|Parse Error|Compile Error" "$RUNNER_TEMP/import.log"; then
            grep -E -A3 "SCRIPT ERROR|Parse Error|Compile Error" "$RUNNER_TEMP/import.log" | head -40
            tail -5 "$RUNNER_TEMP/import.log"
            echo "::error::the project failed to import or compile (exit $code)"
            exit 1
          fi

  shard:
    name: shard ${{ matrix.shard }}
    needs: [plan, preflight]
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # a red shard should not hide the others' results
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The Kaiju Claw display fonts are LFS (3 files, ~26 KB): without them every heading
          # and button draws nothing and the flow suite's font check fails.
          lfs: true
      # Sounds are LFS objects; fetch only them (about 200 KB) so the game loads real audio.
      - name: Fetch the sound files
        run: git lfs pull --include="assets/sfx/*"
      - uses: ./.github/actions/setup-godot

      - name: Run the suites in this shard
        env:
          SUITES: ${{ matrix.suites }}
        run: VERBOSE=1 SUITES_ONLY=1 GODOT="$HOME/godot/godot" LOG_DIR="$RUNNER_TEMP/test-logs" tools/run_tests.sh $SUITES

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-logs

  # What run_tests.sh does after the suites: the harness self-test (an uncalled or
  # check-less test function fails, an untyped declaration does not compile).
  extras:
    name: harness self-test
    needs: [plan, preflight]
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The Kaiju Claw display fonts are LFS (3 files, ~26 KB): without them every heading
          # and button draws nothing and the flow suite's font check fails.
          lfs: true
      # Sounds are LFS objects; fetch only them (about 200 KB) so the game loads real audio.
      - name: Fetch the sound files
        run: git lfs pull --include="assets/sfx/*"
      - uses: ./.github/actions/setup-godot

      - name: Run the harness self-test
        run: VERBOSE=1 EXTRAS_ONLY=1 GODOT="$HOME/godot/godot" LOG_DIR="$RUNNER_TEMP/test-logs" tools/run_tests.sh

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-extras
          path: ${{ runner.temp }}/test-logs

  # Slow suites (pr_skip; none yet): pushes to main only. CI runners vary in speed, so a red run is a
  # prompt to look, never a stop.
  slow:
    name: slow suites (main only)
    needs: [plan, preflight]
    if: needs.plan.outputs.code == 'true' && github.event_name != 'pull_request' && needs.plan.outputs.slow != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The Kaiju Claw display fonts are LFS (3 files, ~26 KB): without them every heading
          # and button draws nothing and the flow suite's font check fails.
          lfs: true
      # Sounds are LFS objects; fetch only them (about 200 KB) so the game loads real audio.
      - name: Fetch the sound files
        run: git lfs pull --include="assets/sfx/*"
      - uses: ./.github/actions/setup-godot

      - name: Run the slow suites
        env:
          SUITES: ${{ needs.plan.outputs.slow }}
        run: VERBOSE=1 SUITES_ONLY=1 GODOT="$HOME/godot/godot" LOG_DIR="$RUNNER_TEMP/test-logs" tools/run_tests.sh $SUITES

  # The required check. Its name stays "test" so branch protection never changes.
  test:
    needs: [plan, preflight, shard, extras]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          PLAN: ${{ needs.plan.result }}
          CODE: ${{ needs.plan.outputs.code }}
          REASON: ${{ needs.plan.outputs.reason }}
          PREFLIGHT: ${{ needs.preflight.result }}
          SHARDS: ${{ needs.shard.result }}
          EXTRAS: ${{ needs.extras.result }}
        run: |
          echo "plan=$PLAN code=$CODE preflight=$PREFLIGHT shards=$SHARDS extras=$EXTRAS"
          if [ "$PLAN" != success ]; then
            echo "::error::the plan job failed: the checkout or tools/plan_ci_shards.sh broke"
            exit 1
          fi
          if [ "$CODE" = true ]; then
            if [ "$PREFLIGHT" != success ]; then
              echo "::error::the project does not import or compile (preflight: $PREFLIGHT); its log names the script"
              exit 1
            fi
            if [ "$SHARDS" != success ]; then
              echo "::error::a test shard did not pass (shards: $SHARDS); the red shard's log names the suite and check"
              exit 1
            fi
            if [ "$EXTRAS" != success ]; then
              echo "::error::the harness self-test job did not pass (extras: $EXTRAS); its log names what failed"
              exit 1
            fi
          else
            echo "The Godot checks were skipped ($REASON)."
          fi
