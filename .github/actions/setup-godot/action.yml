name: Set up Godot
description: Downloads (cached) the Linux Godot used by the test jobs to ~/godot/godot.
inputs:
  save-cache:
    description: "false: restore the cache but never save it (jobs that run code from an arbitrary ref, e.g. pacing.yml)"
    default: "true"
  version:
    description: Godot version
    default: "4.7.2"
runs:
  using: composite
  steps:
    - name: Cache Godot
      id: godot-cache-rw
      if: inputs.save-cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ inputs.version }}-linux-x86_64
    - name: Cache Godot (restore only)
      id: godot-cache-ro
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/godot
        key: godot-${{ inputs.version }}-linux-x86_64

    - name: Download Godot ${{ inputs.version }}
      if: (steps.godot-cache-rw.outputs.cache-hit || steps.godot-cache-ro.outputs.cache-hit) != 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.version }}
      run: |
        mkdir -p ~/godot && cd ~/godot
        name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
        curl -fsSL --retry 3 -o godot.zip \
          "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip" \
        || curl -fsSL --retry 3 -o godot.zip \
          "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
        unzip -q godot.zip && rm godot.zip
        mv "${name}" godot && chmod +x godot
